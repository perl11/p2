version: 0.4.{build}
skip_tags: true
image: Visual Studio 2019
platform:
  #- x86
  - x64
clone_depth: 1
environment:
  matrix:
    - MSYSTEM: MINGW64
      # gcc must be the mingw-w64 one (PATH order below); the MSYS posix
      # cc compiles but is not detected as WIN32 by tools/config.sh
      CC: gcc
    #- MSYSTEM: MINGW32
init:
  - git config --global core.autocrlf input
install:
  # mingw-get is gone from the images: use the preinstalled MSYS2
  # mingw64/bin must precede usr/bin (as in a real MSYS2 MINGW64 shell),
  # else cc/gcc resolve to the MSYS posix toolchain and WIN32 detection
  # in tools/config.sh fails -> wrong pcre/libuv build branch (autogen)
  - set PATH=C:\msys64\%MSYSTEM%\bin;C:\msys64\usr\bin;C:\msys64\usr\bin\core_perl;%PATH%
  - bash -lc "pacman --noconfirm -S --needed make git"
  - bash -lc "pacman --noconfirm -S --needed mingw-w64-$(uname -m)-gcc"
  # 3rd/libuv builds via autogen.sh + configure on WIN32
  - bash -lc "pacman --noconfirm -S --needed autoconf automake libtool"
  # test/roast5.sh runs prove (bin/p2 has no own test runner)
  - bash -lc "pacman --noconfirm -S --needed perl"
  - bash -c "prove --version"
  - git submodule update --init
build_script:
  # -l (login) would cd to the MSYS2 home; -c inherits the build dir
  - bash -c "make"
test_script:
  - bash -c "make test"
