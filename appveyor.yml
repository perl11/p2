version: 0.4.{build}
skip_tags: true
image: Visual Studio 2019
platform:
  #- x86
  - x64
clone_depth: 1
environment:
  matrix:
    - MSYSTEM: MINGW64
    #- MSYSTEM: MINGW32
init:
  - git config --global core.autocrlf input
install:
  # mingw-get is gone from the images: use the preinstalled MSYS2
  - set PATH=C:\msys64\usr\bin;C:\msys64\%MSYSTEM%\bin;%PATH%
  - bash -lc "pacman --noconfirm -S --needed make git"
  - bash -lc "pacman --noconfirm -S --needed mingw-w64-$(uname -m)-gcc"
  - git submodule update --init
build_script:
  - bash -lc "make"
test_script:
  - bash -lc "make test"
